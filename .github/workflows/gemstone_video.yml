name: YUGRAAL Gemstone Video Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'  # Har roz dopahar 12 baje auto-run hoga

# GitHub Bot ko repo me Push karne ki permission
permissions:
  contents: write

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & Devanagari Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq edge-tts "moviepy>=2.0.0" pillow

      - name: Run Gemstone Video Generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python gemstone_engine.py

      - name: Commit Rendered Video to Repository
        run: |
          git config --global user.name 'YUGRAAL-VideoBot'
          git config --global user.email 'videobot@yugraal.internal'
          git add output/
          git commit -m "🎬 Generated New Gemstone Story Video via Groq" || exit 0
          git push
