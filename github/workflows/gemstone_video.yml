name: YUGRAAL Gemstone Video Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'  # Har roz shaam ko 5:30 PM IST (12:00 UTC) par chalega

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai edge-tts moviepy pillow pywhatkit

      - name: Run Gemstone Video Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python gemstone_engine.py

      - name: Commit Rendered Video to Repository
        run: |
          git config --global user.name 'YUGRAAL-VideoBot'
          git config --global user.email 'videobot@yugraal.internal'
          git add output/
          git commit -m "🎬 Generated New Gemstone Story Video" || exit 0
          git push
